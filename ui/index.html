<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>network-sandbox</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1016;
        --panel: #121922;
        --line: #243042;
        --ink: #e7eef8;
        --muted: #8b9bb0;
        --accent: #3ee0c5;
        --accent-dim: #1a4f48;
        --warn: #e6b84d;
        --drop: #e08a4f;
        --flood: #7ab0ff;
        --wire: #6ee0c8;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { background: var(--bg); color: var(--ink); }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 13rem minmax(0, 1fr) 24rem;
        grid-template-rows: auto 1fr;
        gap: 0;
      }
      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: 0.85rem 1.1rem;
        border-bottom: 1px solid var(--line);
        background: #0e151d;
      }
      h1 { margin: 0; font-size: 1.05rem; font-weight: 650; letter-spacing: 0.02em; }
      .tagline { margin: 0; color: var(--muted); font-size: 0.82rem; }
      h2 { font-size: 0.72rem; margin: 0 0 0.55rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
      h3 { font-size: 0.8rem; margin: 0.75rem 0 0.25rem; }
      aside, #stage, #rail {
        padding: 0.9rem;
        min-height: 0;
      }
      aside, #rail {
        background: var(--panel);
        border-right: 1px solid var(--line);
        overflow: auto;
      }
      #rail { border-right: 0; border-left: 1px solid var(--line); }
      #stage { overflow: auto; }
      button, select, input, textarea {
        font: inherit;
        color: var(--ink);
        background: #1a2430;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      button { cursor: pointer; padding: 0.35rem 0.6rem; }
      button:hover { border-color: var(--accent); }
      .preset {
        display: flex;
        width: 100%;
        text-align: left;
        margin: 0 0 0.4rem;
        padding: 0.5rem 0.6rem 0.5rem 2.1rem;
        position: relative;
      }
      .preset::before {
        content: "";
        position: absolute;
        left: 0.55rem;
        top: 50%;
        width: 0.85rem;
        height: 0.85rem;
        transform: translateY(-50%);
        border: 1.5px solid var(--accent);
        border-radius: 3px;
      }
      .preset[data-preset="host"]::before { border-radius: 2px; }
      .preset[data-preset="router"]::before { border-radius: 99px; }
      .preset[data-preset="access-point"]::before { border-radius: 99px; box-shadow: 0 0 0 3px #3ee0c533; }
      .preset[data-preset="modem"]::before { width: 1.05rem; height: 0.55rem; }
      .device-list, .link-list { list-style: none; padding: 0; margin: 0; }
      .device-list li { margin: 0.25rem 0; }
      .device.selected { outline: 2px solid var(--accent); }
      .linking { background: #3d2e12; color: #f3d9a4; padding: 0.4rem; border-radius: 4px; }
      .notice { color: var(--warn); }
      .hint { color: var(--muted); font-size: 0.82rem; }
      .warnings p { background: #3d2e12; color: #f3d9a4; padding: 0.4rem; border-radius: 4px; }
      .notices p { color: var(--muted); font-size: 0.82rem; }
      fieldset.port { margin: 0.5rem 0; border-color: var(--line); }
      label { display: block; margin: 0.3rem 0; font-size: 0.85rem; }
      #json-view { width: 100%; min-height: 6rem; margin-top: 0.5rem; font-family: ui-monospace, monospace; font-size: 0.78rem; }
      .camera-bar { margin: 0 0 0.4rem; }
      .canvas-svg {
        width: 100%;
        min-height: 28rem;
        height: calc(100vh - 9rem);
        background: #0a121a;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: #1c2a38;
        overflow: hidden;
        touch-action: none;
      }
      .canvas-svg .grid { opacity: 0.9; }
      .canvas-svg .box-shadow { fill: #05080c; }
      .canvas-svg .box { fill: #182230; stroke: #3a5168; stroke-width: 1.4; }
      .canvas-svg .box-head { fill: #3ee0c522; stroke: none; }
      .canvas-svg .device.selected .box { stroke: var(--accent); stroke-width: 2.2; filter: drop-shadow(0 0 6px #3ee0c566); }
      .canvas-svg .glyph { fill: none; stroke: #9ec3c0; stroke-width: 1.6; }
      .canvas-svg .glyph-fill { fill: #0d1c22; stroke: none; }
      .canvas-svg .led { fill: var(--accent); stroke: none; }
      .canvas-svg .led.dim { fill: #4d6270; }
      .canvas-svg .glyph.radio { fill: none; stroke: #7ab0ff; }
      .canvas-svg .label { font-size: 11px; fill: var(--ink); }
      .canvas-svg .port { fill: #0d1c22; stroke: #7f93a8; stroke-width: 1.2; }
      .canvas-svg .port.occupied { fill: var(--accent-dim); stroke: var(--accent); }
      .canvas-svg .port.pending { fill: #d33682; stroke: #ff9ac8; }
      .canvas-svg .link-glow { fill: none; stroke: #3ee0c822; stroke-width: 8; }
      .canvas-svg .link { fill: none; stroke: var(--wire); stroke-width: 2.2; stroke-linecap: round; }
      .canvas-svg .link.wireless, .canvas-svg .link-glow.wireless { stroke: var(--warn); stroke-dasharray: 7 6; }
      .canvas-svg .link.down, .canvas-svg .link-glow.down { opacity: 0.28; }
      .canvas-svg .link.wired.live {
        stroke: #9ff5e6;
        stroke-width: 3.2;
        filter: drop-shadow(0 0 5px #3ee0c5);
      }
      .canvas-svg .link-glow.wired.live { stroke: #3ee0c555; }
      .canvas-svg .link.wireless.live { stroke: #ffe08a; }
      .canvas-svg .assumption { fill: var(--warn); font-size: 10px; }
      .canvas-svg .token { fill: #3ee0c655; stroke: var(--accent); stroke-width: 1.5; filter: drop-shadow(0 0 6px #3ee0c5); }
      .canvas-svg .token-core { fill: #f4fffc; stroke: none; }
      .canvas-svg .token.flooded, .canvas-svg .token-core.flooded { fill: #7ab0ff66; stroke: var(--flood); }
      .canvas-svg .token-core.flooded { fill: #dce9ff; }
      .canvas-svg .token.dropped { fill: #e08a4f55; stroke: var(--drop); }
      .canvas-svg .token-core.dropped { fill: #ffd7b8; }
      .canvas-svg .token.delivered { fill: #3ee0c640; stroke: var(--accent); }
      .hops { padding-left: 1.1rem; }
      .hops li { font-family: ui-monospace, monospace; font-size: 0.8rem; margin: 0.2rem 0; padding: 0.15rem 0.3rem; border-radius: 4px; }
      .hops li.active {
        outline: none;
        background: #16352f;
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .replay { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.5rem 0 0.75rem; }
      #send-form { display: grid; gap: 0.35rem; margin-bottom: 0.75rem; }
      @media (max-width: 70rem) {
        body { grid-template-columns: 1fr; }
        header { grid-column: auto; }
        aside, #rail { border: 0; border-bottom: 1px solid var(--line); }
        .canvas-svg { height: 22rem; }
      }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header>
      <h1>network-sandbox</h1>
      <p class="tagline">802.1Q bench &mdash; the topology is the file</p>
    </header>
    <aside id="palette"></aside>
    <section id="stage"></section>
    <section id="rail">
      <div id="inspector"></div>
      <div id="trace"></div>
    </section>
  </body>
</html>
